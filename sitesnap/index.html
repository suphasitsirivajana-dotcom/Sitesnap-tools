<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SiteSnap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SiteSnap – จัดภาพเป็นหมวด</title>
<style>
:root{--bg:#f5f7f7;--card:#fff;--ink:#12302d;--mut:#6b7f7c;--pri:#0f766e;--pri2:#e0f2f0;--line:#dbe4e3;--danger:#c0392b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif;font-size:16px}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:14px 16px 8px;font-weight:700;font-size:20px;display:flex;justify-content:space-between;align-items:center}
header small{font-weight:400;color:var(--mut);font-size:13px}
main{flex:1;overflow:auto;padding:0 14px 90px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;border:0;background:none;padding:10px 0 8px;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit}
nav button span{font-size:22px;line-height:1}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.btn{border:0;border-radius:12px;padding:13px 16px;font-size:16px;font-family:inherit;background:var(--pri);color:#fff;font-weight:600;width:100%}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.dng{background:#fdecea;color:var(--danger)}
.btn.big{padding:28px 16px;font-size:20px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.ai{box-shadow:0 0 0 2px #f5b942}
input[type=text],input[type=password],select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.grid div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#dde}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.7));color:#fff;font-size:11px;padding:10px 4px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:10;display:none;align-items:flex-end}
.sheet.show{display:flex}
.sheet>div{background:var(--bg);width:100%;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
.sheet img.pv{width:100%;max-height:38vh;object-fit:contain;background:#000;border-radius:10px}
.muted{color:var(--mut);font-size:13px}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li button{border:0;background:none;color:var(--danger);font-size:20px;padding:4px 10px}
.sw{display:flex;justify-content:space-between;align-items:center}
.sw input{width:48px;height:28px}
.hide{display:none}
</style>
</head>
<body>
<header><div>📷 SiteSnap <small>จัดภาพเป็นหมวด</small></div><small id="cnt"></small></header>
<main id="main"></main>
<nav>
  <button data-t="cam" class="on"><span>📷</span>ถ่ายภาพ</button>
  <button data-t="gal"><span>🗂️</span>คลังภาพ</button>
  <button data-t="set"><span>⚙️</span>ตั้งค่า</button>
</nav>

<input type="file" id="fCam" accept="image/*" capture="environment" class="hide">
<input type="file" id="fPick" accept="image/*" multiple class="hide">

<div class="sheet" id="sheet"><div id="sheetBody"></div></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TPL={
 general:{name:"ทั่วไป (ใช้ได้ทุกคน)",labels:{cat:"โฟลเดอร์",work:"โฟลเดอร์ย่อย",area:"สถานที่",room:"รายละเอียด"},cats:["ครอบครัว","สัตว์เลี้ยง","อาหาร","ท่องเที่ยว","งาน","อื่นๆ"],works:[],rooms:[]},
 construction:{name:"งานก่อสร้าง / หน้างาน",labels:{cat:"หมวดภาพ",work:"หมวดงาน / โครงการ",area:"อยู่ตรงไหน",room:"ห้อง/จุดนี้คืออะไร"},cats:["หน้าต่าง","ประตู","สุขภัณฑ์","พื้น","ฝ้าเพดาน","งานไฟฟ้า","งานท่อ","อื่นๆ"],works:[],rooms:["ห้องน้ำ","ห้องนอน","ห้องนั่งเล่น","ห้องครัว","ระเบียง","ทางเดิน","ล็อบบี้","บันไดหนีไฟ"]},
 pets:{name:"สัตว์เลี้ยง",labels:{cat:"สัตว์",work:"ชื่อ / ตัว",area:"สถานที่",room:"กำลังทำอะไร"},cats:["สุนัข","แมว","นก","ปลา","อื่นๆ"],works:[],rooms:["กินข้าว","เล่น","นอน","พาไปหาหมอ","อาบน้ำ"]},
 food:{name:"อาหาร",labels:{cat:"ประเภท",work:"มื้อ / ร้าน",area:"สถานที่",room:"เมนู / หมายเหตุ"},cats:["อาหารคาว","ของหวาน","เครื่องดื่ม","ทำเอง","ร้านอาหาร"],works:["มื้อเช้า","มื้อกลางวัน","มื้อเย็น"],rooms:[]},
 blank:{name:"เริ่มจากว่าง (ตั้งเองทั้งหมด)",labels:{cat:"โฟลเดอร์",work:"โฟลเดอร์ย่อย",area:"สถานที่",room:"รายละเอียด"},cats:[],works:[],rooms:[]}
};
const DEF_ROOMS=["ห้องน้ำ","ห้องนอน","ห้องนั่งเล่น","ห้องครัว","ระเบียง","ทางเดิน","ล็อบบี้","บันไดหนีไฟ"];
const DEF_CATS=["หน้าต่าง","ประตู","สุขภัณฑ์","พื้น","ฝ้าเพดาน","งานไฟฟ้า","งานท่อ","อื่นๆ"];
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const S={cats:load("ss_cats",TPL.general.cats),ai:load("ss_ai",false),key:load("ss_key",""),lastWork:load("ss_lastWork",""),lastCat:load("ss_lastCat",""),lastArea:load("ss_lastArea",""),stamp:load("ss_stamp",true),geo:load("ss_geo",true),logo:load("ss_logo",""),works:load("ss_works",[]),areas:load("ss_areas",{}),rooms:load("ss_rooms",TPL.general.rooms),labels:load("ss_labels",TPL.general.labels),on:load("ss_on",{cat:true,work:true,area:true,room:true}),lastRoom:load("ss_lastRoom",""),folder:load("ss_folder","cat>work"),fname:load("ss_fname",["time"])};
const persist=()=>{save("ss_cats",S.cats);save("ss_ai",S.ai);save("ss_key",S.key);save("ss_lastWork",S.lastWork);save("ss_lastCat",S.lastCat);save("ss_lastArea",S.lastArea);save("ss_stamp",S.stamp);save("ss_geo",S.geo);save("ss_logo",S.logo);save("ss_works",S.works);save("ss_areas",S.areas);save("ss_rooms",S.rooms);save("ss_lastRoom",S.lastRoom);save("ss_folder",S.folder);save("ss_labels",S.labels);save("ss_on",S.on);save("ss_fname",S.fname)};

/* ---------- location + timestamp ---------- */
const fmtTime=t=>new Date(t).toLocaleString("th-TH",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
function getGeo(){return new Promise(res=>{
  if(!S.geo||!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(
    p=>res({lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),
    ()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:20000});
})}
async function placeName(g){
  if(!g||!navigator.onLine)return "";
  try{const c=new AbortController();const t=setTimeout(()=>c.abort(),5000);
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=th&lat=${g.lat}&lon=${g.lon}`,{signal:c.signal});
    clearTimeout(t);const j=await r.json();
    return (j.display_name||"").split(", ").slice(0,4).join(" ");
  }catch{return ""}
}
const locate=()=>getGeo().then(async g=>{if(g)g.place=await placeName(g);return g});
const geoText=g=>g?`${g.place?g.place+" · ":""}${g.lat}, ${g.lon} (±${g.acc} ม.)`:"";
async function stampBlob(blob,lines){
  const bmp=await createImageBitmap(blob);
  const c=document.createElement("canvas");c.width=bmp.width;c.height=bmp.height;
  const x=c.getContext("2d");x.drawImage(bmp,0,0);
  if(S.logo){
    const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=S.logo});
    if(im){const k=Math.min(c.width*0.13/im.width,c.height*0.18/im.height),m=c.width*0.02;x.drawImage(im,m,m,im.width*k,im.height*k)}
  }
  if(!lines.length)return new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
  const fs=Math.max(14,Math.round(c.width/36)),pad=fs*0.6,lh=fs*1.25;
  x.font=`600 ${fs}px system-ui,"Noto Sans Thai",sans-serif`;
  const out=[];
  for(let l of lines){
    while(l){let n=l.length;while(n>1&&x.measureText(l.slice(0,n)).width>c.width-pad*2)n--;out.push(l.slice(0,n));l=l.slice(n)}
  }
  const h=out.length*lh+pad*1.2;
  x.fillStyle="rgba(0,0,0,.55)";x.fillRect(0,c.height-h,c.width,h);
  x.fillStyle="#fff";x.textBaseline="top";
  out.forEach((l,i)=>x.fillText(l,pad,c.height-h+pad*0.6+i*lh));
  return new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
}

/* ---------- IndexedDB ---------- */
let db;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open("sitesnap",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id"});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const tx=(m)=>db.transaction("photos",m).objectStore("photos");
const dbAll=()=>new Promise((res,rej)=>{const r=tx("readonly").getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbPut=o=>new Promise((res,rej)=>{const r=tx("readwrite").put(o);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
const dbDel=id=>new Promise((res,rej)=>{const r=tx("readwrite").delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
let photos=[];
const refresh=async()=>{photos=(await dbAll()).sort((a,b)=>b.ts-a.ts);$("#cnt").textContent=photos.length+" ภาพ"};

/* ---------- image processing ---------- */
async function shrink(file,max,q){
  const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",q));
}
const blobToB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(b)});

/* ---------- AI suggestion (optional) ---------- */
async function aiSuggest(blob){
  const small=await shrink(blob,768,0.7);
  const data=await blobToB64(small);
  const list=S.cats.join(", ");
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
    "content-type":"application/json","x-api-key":S.key,"anthropic-version":"2023-06-01",
    "anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:30,messages:[{role:"user",content:[
      {type:"image",source:{type:"base64",media_type:"image/jpeg",data}},
      {type:"text",text:"นี่คือภาพถ่าย จงเลือกหมวดที่ตรงที่สุด 1 หมวดจากรายการนี้: "+list+"\nตอบเป็นชื่อหมวดตามรายการเท่านั้น ห้ามมีข้อความอื่น ถ้าไม่เข้าหมวดใดเลยให้ตอบว่า NONE"}]}]})});
  if(!r.ok)throw new Error("AI "+r.status);
  const j=await r.json();
  const t=(j.content?.[0]?.text||"").trim();
  return S.cats.find(c=>t.includes(c))||null;
}

/* ---------- capture flow ---------- */
let queue=[],cur=null;
$("#fCam").onchange=e=>addFiles(e.target.files,"cam");
$("#fPick").onchange=e=>addFiles(e.target.files,"pick");
function addFiles(fl,src){
  /* กล้อง: เวลา+พิกัด ณ ตอนถ่าย / อัลบั้ม: ใช้เวลาไฟล์ ไม่ใส่พิกัด (ไม่รู้ว่าถ่ายที่ไหน) */
  const geoP=src==="cam"?locate():Promise.resolve(null);
  for(const f of fl)queue.push({f,src,geoP,shot:src==="cam"?Date.now():(f.lastModified||Date.now())});
  $("#fCam").value="";$("#fPick").value="";if(!cur)next();
}
async function next(){
  const q=queue.shift();
  if(!q){cur=null;closeSheet();await refresh();render();return}
  const f=q.f;
  const full=await shrink(f,1600,0.82),thumb=await shrink(f,360,0.7);
  cur={id:Date.now()+Math.random().toString(36).slice(2,6),ts:q.shot,blob:full,thumb,cat:S.lastCat||"",work:S.lastWork,room:S.lastRoom,area:S.lastArea,note:"",ai:null,url:URL.createObjectURL(full),src:q.src,geo:undefined,geoP:q.geoP};
  { const id=cur.id; q.geoP.then(g=>{if(cur&&cur.id===id){cur.geo=g;const el=$("#locLine");if(el)el.innerHTML=locHTML()}}); }
  showCapture();
  if(S.ai&&S.key&&navigator.onLine){
    const id=cur.id;
    try{const c=await aiSuggest(full);if(cur&&cur.id===id){cur.ai=c||"";if(c)cur.cat=c;showCapture()}}
    catch(e){if(cur&&cur.id===id){cur.ai="ERR";showCapture()}}
  }
}
function chipsHTML(sel,aiCat){return S.cats.map(c=>`<button class="chip ${c===sel?"on":""} ${c===aiCat?"ai":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}
const KIND=new Proxy({},{get:(_,k)=>(S.labels&&S.labels[k])||k});
let editOpts=false;
function presetList(kind,E){
  let l=kind==="cat"?S.cats:kind==="work"?S.works:kind==="room"?S.rooms:(S.areas[E.work||""]||[]);
  l=[...l];if(E[kind]&&!l.includes(E[kind]))l.push(E[kind]);return l;
}
function addPreset(kind,v,E){
  const add=(a)=>{if(!a.includes(v))a.push(v)};
  if(kind==="cat")add(S.cats);else if(kind==="work")add(S.works);else if(kind==="room")add(S.rooms);
  else add(S.areas[E.work||""]||(S.areas[E.work||""]=[]));
  persist();
}
function pickHTML(kind,E){
  return `<label>${KIND[kind]}${kind==="area"?` <span style="color:#0f766e">${E.work?"· ของ "+esc(E.work):"· (ยังไม่เลือก"+esc(KIND.work)+")"}</span>`:""}</label>
  <div class="chips" data-k="${kind}">${presetList(kind,E).map(v=>`<button class="chip ${v===E[kind]&&!editOpts?"on":""} ${kind==="cat"&&v===E.ai?"ai":""}" data-v="${esc(v)}" ${editOpts?'style="border-color:#c0392b;color:#c0392b"':""}>${esc(v)}${editOpts?" ✕":""}</button>`).join("")}<button class="chip" data-add="1" style="border-style:dashed">＋ เพิ่ม</button></div>`;
}
function removePreset(kind,v,E){
  const rm=(a)=>{const i=a.indexOf(v);if(i>=0)a.splice(i,1)};
  if(kind==="cat")rm(S.cats);else if(kind==="room")rm(S.rooms);
  else if(kind==="work"){rm(S.works);delete S.areas[v]}
  else rm(S.areas[E.work||""]||[]);
  persist();
}
function formHTML(E){
  return `<div style="text-align:right;margin-top:8px"><button class="chip ${editOpts?"on":""}" id="eo">${editOpts?"✓ เสร็จ":"✎ แก้ไข/ลบตัวเลือก"}</button></div>`+
    ["cat","work","area","room"].filter(k=>S.on[k]).map(k=>pickHTML(k,E)).join("");
}
function readNote(E){const n=$("#note");if(n)E.note=n.value}
function bindForm(E,rerender){
  const eo=$("#eo");if(eo)eo.onclick=()=>{readNote(E);editOpts=!editOpts;rerender()};
  document.querySelectorAll("#sheetBody .chips[data-k]").forEach(box=>{
    const k=box.dataset.k;
    box.onclick=e=>{
      const b=e.target.closest("button");if(!b||b.id==="addOk")return;
      readNote(E);
      if(b.dataset.add){
        b.outerHTML=`<span style="display:inline-flex;gap:6px;width:100%"><input type="text" id="addIn" placeholder="พิมพ์ชื่อ ${esc(KIND[k])} ใหม่" style="padding:8px"><button class="chip on" id="addOk">เพิ่ม</button></span>`;
        const inp=$("#addIn");inp.focus();
        const commit=()=>{const v=inp.value.trim();if(v){addPreset(k,v,E);E[k]=v}rerender()};
        $("#addOk").onclick=commit;inp.onkeydown=ev=>{if(ev.key==="Enter")commit()};
        return;
      }
      const v=b.dataset.v;
      if(editOpts){removePreset(k,v,E);if(E[k]===v)E[k]="";rerender();return}
      E[k]=(k!=="cat"&&E[k]===v)?"":v;
      if(k==="work"&&E.area&&!(S.areas[E.work||""]||[]).includes(E.area))E.area="";
      rerender();
    };
  });
}
const uniq=f=>[...new Set(photos.map(p=>p[f]).filter(Boolean))];
const dl=(id,f)=>`<datalist id="${id}">${uniq(f).map(w=>`<option value="${esc(w)}">`).join("")}</datalist>`;
function worksList(){return [...new Set(photos.map(p=>p.work).filter(Boolean).concat(S.lastWork?[S.lastWork]:[]))]}
function locHTML(){
  const t="🕒 "+fmtTime(cur.ts);
  if(cur.src!=="cam")return t+" · (ภาพจากอัลบั้ม ไม่มีพิกัด)";
  if(!S.geo)return t+" · 📍 ปิดการบันทึกตำแหน่ง";
  if(cur.geo===undefined)return t+"<br>📍 กำลังหาตำแหน่ง…";
  if(!cur.geo)return t+"<br>⚠️ ไม่ได้ตำแหน่ง (ตรวจสอบว่าอนุญาต Location แล้ว)";
  return t+"<br>📍 "+esc(geoText(cur.geo));
}
function showCapture(){
  const ai=S.ai?(!S.key?"⚠️ ยังไม่ได้ใส่ API key":cur.ai===null?"🤖 AI กำลังดูภาพ…":cur.ai==="ERR"?"⚠️ AI ใช้ไม่ได้ (เลือกเองได้)":cur.ai?"🤖 AI แนะนำ: "+esc(cur.ai):"🤖 AI ไม่แน่ใจ เลือกเอง"):"";
  $("#sheetBody").innerHTML=`
   <img class="pv" src="${cur.url}">
   <div class="muted" style="margin-top:6px" id="locLine">${locHTML()}</div>${cur.src==="cam"&&S.geo?'<button class="chip" id="reloc" style="margin-top:6px">🔄 หาตำแหน่งใหม่</button>':""}
   <div class="muted" style="margin-top:4px">${ai}${queue.length?` · เหลืออีก ${queue.length} ภาพ`:""}</div>
   ${formHTML(cur)}
   <label>บันทึกเพิ่มเติม (ไม่บังคับ)</label><input type="text" id="note" value="${esc(cur.note)}">
   <div id="err" class="muted" style="color:#c0392b;margin-top:8px"></div>
   <div class="row" style="margin-top:6px"><button class="btn dng" id="skip">ทิ้งภาพ</button><button class="btn" id="ok">บันทึก</button></div>`;

    S.lastCat=cur.cat;S.lastWork=cur.work;S.lastArea=cur.area;S.lastRoom=cur.room;persist();
    const okb=$("#ok");okb.disabled=true;okb.textContent="กำลังบันทึก…";
    const g=cur.geo!==undefined?cur.geo:await cur.geoP;
    if(S.stamp||S.logo){

      if(S.stamp&&g)lines.push("📍 "+geoText(g));
      if(S.stamp){if(cur.room||cur.area)lines.push((cur.room?KIND.room+": "+cur.room:"")+(cur.room&&cur.area?" | ":"")+(cur.area?KIND.area+": "+cur.area:""));
      lines.push([cur.cat,cur.work].filter(Boolean).join(" · "));}

    rec.lat=g?g.lat:null;rec.lon=g?g.lon:null;rec.acc=g?g.acc:null;rec.place=g?g.place||"":"";

/* ---------- ZIP export (store only) ---------- */
const CT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
const folders=()=>{const L=KIND;return {"cat>work":`${L.cat} / ${L.work}`,"work>cat":`${L.work} / ${L.cat}`,"cat>work>area":`${L.cat} / ${L.work} / ${L.area}`,"cat>area":`${L.cat} / ${L.area}`,"cat":`${L.cat} อย่างเดียว`,"work":`${L.work} อย่างเดียว`,"flat":"ไม่แยกโฟลเดอร์"}};
const fnames=()=>({time:"วันเวลา",cat:KIND.cat,work:KIND.work,area:KIND.area,room:KIND.room,note:"บันทึก"});
const cleanN=s=>String(s||"").replace(/[\\/:*?"<>|]/g,"_").trim();
function pathFor(p){
  const pad=n=>String(n).padStart(2,"0"),d=new Date(p.ts);
  const tn=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  const dir=S.folder==="flat"?[]:S.folder.split(">").map(k=>cleanN(p[k])||"ไม่ระบุ");
  const nm=["time","work","cat","area","room","note"].filter(k=>S.fname.includes(k)).map(k=>k==="time"?tn:cleanN(p[k])).filter(Boolean).join("_")||tn;
  return [...dir,nm+".jpg"].join("/");
}
async function shareList(list){
  const files=list.map(p=>new File([p.blob],pathFor(p).split("/").pop(),{type:"image/jpeg"}));
  if(navigator.canShare&&navigator.canShare({files})){
    try{await navigator.share({files,title:"SiteSnap",text:list.length+" ภาพ"})}catch(e){}
  }else alert("เครื่อง/เบราว์เซอร์นี้แชร์ไฟล์โดยตรงไม่ได้ ใช้ส่งออก ZIP ในหน้าตั้งค่าแทน");
}
async function exportZip(){
  if(!photos.length){alert("ยังไม่มีภาพ");return}
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const clean=s=>(s||"ไม่ระบุ").replace(/[\\/:*?"<>|]/g,"_");
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)),dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
  const used=new Set(),rows=[["เวลา",KIND.work,KIND.cat,KIND.room,KIND.area,"ละติจูด","ลองจิจูด","ลิงก์ Google Maps","สถานที่","บันทึก","ไฟล์"]];
  const add=(name,data)=>{
    const nm=enc.encode(name),c=crc(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
    h.setUint32(14,c,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,nm,data);
    const e=new DataView(new ArrayBuffer(46));
    e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(10,0,true);e.setUint16(12,dt,true);e.setUint16(14,dd,true);
    e.setUint32(16,c,true);e.setUint32(20,data.length,true);e.setUint32(24,data.length,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
    cd.push(e.buffer,nm);off+=30+nm.length+data.length;nFiles++;
  };
  let nFiles=0;
  for(const p of photos){
    let name=pathFor(p);    while(used.has(name))name=name.replace(/\.jpg$/,"_.jpg");used.add(name);
    add(name,new Uint8Array(await p.blob.arrayBuffer()));
    rows.push([fmtTime(p.ts),p.work,p.cat,p.room||"",p.area||"",p.lat??"",p.lon??"",p.lat!=null?`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`:"",p.place||"",p.note||"",name]);
  }
  const csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  add("index.csv",enc.encode(csv));
  const cdSize=cd.reduce((a,b)=>a+(b.byteLength??b.length),0);
  const z=new DataView(new ArrayBuffer(22));
  z.setUint32(0,0x06054b50,true);z.setUint16(8,nFiles,true);z.setUint16(10,nFiles,true);z.setUint32(12,cdSize,true);z.setUint32(16,off,true);
  const blob=new Blob([...parts,...cd,z.buffer],{type:"application/zip"});
  const file=new File([blob],`SiteSnap_${new Date().toISOString().slice(0,10)}.zip`,{type:"application/zip"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;a.click();
}

/* ---------- init ---------- */
(async()=>{
  await openDB();await refresh();
  if(!load("ss_sync",false)){
    for(const p of photos){
      if(p.work&&!S.works.includes(p.work))S.works.push(p.work);
      if(p.room&&!S.rooms.includes(p.room))S.rooms.push(p.room);
      if(p.area){const a=S.areas[p.work||""]||(S.areas[p.work||""]=[]);if(!a.includes(p.area))a.push(p.area)}
    }
    save("ss_sync",true);persist();
  }
  render();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
})();
</script>
