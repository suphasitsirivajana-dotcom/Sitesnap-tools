<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SiteSnap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon_192_v2.png">
<title>SiteSnap – Photo organizer</title>
<style>
:root{--bg:#fff;--card:#fff;--ink:#111;--mut:#6b6b6b;--pri:#111;--pri2:#f4f4f4;--line:#e8e8e8;--y:#FFD60A;--danger:#111;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif;font-size:16px}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:12px 20px 6px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;letter-spacing:-.3px}.logo i{font-style:normal;font-weight:400;color:var(--mut)}
#cnt{color:var(--mut);font-size:13px}
main{flex:1;overflow:auto;padding:4px 14px calc(100px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;padding:6px 0;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;border-radius:14px}
nav button{position:relative}nav button.on{color:#111;font-weight:700}nav button.on::after{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:3px;background:var(--y)}
nav button svg{width:22px;height:22px}nav button.on svg{stroke-width:2.2}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.sec{margin:26px 4px 2px;font-size:12px;letter-spacing:.8px;color:var(--mut);text-transform:uppercase;font-weight:600}
.btn{border:0;border-radius:12px;padding:14px 16px;font-size:15px;font-family:inherit;background:var(--y);color:#111;font-weight:700;width:100%}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.dng{background:#fff;color:#111;border:1px solid #111}
.act{align-items:center;margin-top:18px;gap:4px}.act .btn{flex:1.4;padding:12px}.lnk{background:none;border:0;font:inherit;font-size:14px;color:var(--mut);padding:12px 6px}.lnk.dng{color:#111;text-decoration:underline}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--y);border-color:var(--y);color:#111;font-weight:600}
.chip.ai{box-shadow:0 0 0 2px #111}
input[type=text],input[type=password],select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
input[type=checkbox]{width:48px;height:28px;accent-color:var(--pri)}
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 4px;font-weight:600;letter-spacing:.2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.grid div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#dde}
.grid div.on{outline:3px solid #111;outline-offset:-3px}.grid div.on img{opacity:.55}.grid div.on::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--y);color:#111;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center}.selbar{display:flex;gap:6px;align-items:center;margin:8px 0}.selbar .btn{width:auto;padding:10px 14px;flex:0 0 auto}.selbar .grow{flex:1}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:11px;padding:12px 6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{position:fixed;inset:0;background:rgba(10,25,23,.55);z-index:10;display:none;align-items:flex-end;backdrop-filter:blur(3px)}
.sheet.show{display:flex}
.sheet>div{background:var(--bg);width:100%;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet>div::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:#c4d0cd;margin:0 auto 12px}
.sheet img.pv{width:100%;max-height:40vh;object-fit:contain;background:#000;border-radius:14px}
.muted{color:var(--mut);font-size:13px}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li button{border:0;background:none;color:var(--danger);font-size:20px;padding:4px 10px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hide{display:none}
.eorow{text-align:right;margin-top:8px}
/* camera */
.cam{display:flex;flex-direction:column;gap:12px}
.vf{position:relative;background:#111;border-radius:16px;overflow:hidden;aspect-ratio:3/4;max-height:54vh;width:100%}
.vf video{width:100%;height:100%;object-fit:cover;display:block}
.vf .ovl{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 11px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12px;line-height:1.5;text-shadow:0 1px 2px #000;pointer-events:none}
.vf .lg{position:absolute;top:12px;left:12px;height:34px;max-width:30%;object-fit:contain;pointer-events:none}
.vf .tools{position:absolute;top:12px;right:12px;display:flex;gap:8px}
.tbtn{border:0;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:8px 12px;font-size:13px;font-family:inherit;backdrop-filter:blur(6px)}
.vf .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#cfe5e0;text-align:center;padding:24px;font-size:14px}
.vf .msg .btn{width:auto;padding:12px 20px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .28s}
@keyframes fl{from{opacity:.85}to{opacity:0}}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(17,17,17,.92);color:#fff;border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;opacity:0;transition:.2s;white-space:nowrap}
.toast.on{opacity:1}
.tags{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px 10px}
.tags label{margin:8px 0 2px;font-size:12px}
.tags .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -6px;padding:3px 6px 4px;scrollbar-width:none}
.tags .chips::-webkit-scrollbar{display:none}
.tags .chip{white-space:nowrap;flex:0 0 auto}
.tags .eorow{margin-top:4px;float:right}
.shut{display:flex;align-items:center;justify-content:space-between;padding:2px 14px}
.shbtn{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:var(--y);box-shadow:0 0 0 2px #111;transition:transform .1s}
.shbtn:active{transform:scale(.92)}
.side{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card);overflow:hidden;font-size:12px;color:var(--mut);font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0}
.side img{width:100%;height:100%;object-fit:cover}
</style>
</head>

const fmtTime=t=>new Date(t).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
function getGeo(){return new Promise(res=>{
  if(!S.geo||!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(
    p=>res({lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),
    ()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:20000});
})}
async function placeName(g){
  if(!g||!navigator.onLine)return "";
  try{const c=new AbortController();const t=setTimeout(()=>c.abort(),5000);
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=en&lat=${g.lat}&lon=${g.lon}`,{signal:c.signal});
    clearTimeout(t);const j=await r.json();
    return (j.display_name||"").split(", ").slice(0,4).join(", ");
  }catch{return ""}
}
const locate=()=>getGeo().then(async g=>{if(g)g.place=await placeName(g);return g});
const geoText=g=>g?`${g.place?g.place+" · ":""}${g.lat}, ${g.lon} (±${g.acc} m)`:"";
async function stampBlob(blob,lines){
  const bmp=await createImageBitmap(blob);
  const c=document.createElement("canvas");c.width=bmp.width;c.height=bmp.height;
  const x=c.getContext("2d");x.drawImage(bmp,0,0);
  if(S.logo){
    const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=S.logo});
    if(im){const k=Math.min(c.width*0.13/im.width,c.height*0.18/im.height),m=c.width*0.02;x.drawImage(im,m,m,im.width*k,im.height*k)}
  }
  if(!lines.length)return new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
  const fs=Math.max(14,Math.round(c.width/36)),pad=fs*0.6,lh=fs*1.25;
  x.font=`600 ${fs}px system-ui,"Noto Sans Thai",sans-serif`;
  const out=[],col=[];
  lines.forEach(l=>{
    const hl=l.charAt(0)==="\u0001";if(hl)l=l.slice(1);
    while(l){let n=l.length;while(n>1&&x.measureText(l.slice(0,n)).width>c.width-pad*2)n--;out.push(l.slice(0,n));col.push(hl);l=l.slice(n)}
  });
  const h=out.length*lh+pad*1.2;
  x.fillStyle="rgba(0,0,0,.55)";x.fillRect(0,c.height-h,c.width,h);
  x.textBaseline="top";
  out.forEach((l,i)=>{x.fillStyle=col[i]?"#FFD60A":"#fff";x.fillText(l,pad,c.height-h+pad*0.6+i*lh)});
  return new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
}

const tx=(m)=>db.transaction("photos",m).objectStore("photos");

/* ---------- image processing ---------- */
async function shrink(file,max,q){
  const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",q));
}
const blobToB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(b)});

/* ---------- AI suggestion (optional) ---------- */
async function aiSuggest(blob){
  const small=await shrink(blob,768,0.7);
  const data=await blobToB64(small);
  const list=S.cats.join(", ");
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
    "content-type":"application/json","x-api-key":S.key,"anthropic-version":"2023-06-01",
    "anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:30,messages:[{role:"user",content:[
      {type:"image",source:{type:"base64",media_type:"image/jpeg",data}},
      {type:"text",text:"This is a photo. Pick the single best category from this list: "+list+"\nAnswer with the category name exactly as listed, nothing else. If none fits, answer NONE"}]}]})});
  if(!r.ok)throw new Error("AI "+r.status);
  const j=await r.json();
  const t=(j.content?.[0]?.text||"").trim();
  return S.cats.find(c=>t.includes(c))||null;
}

function addFiles(fl,src){
  /* camera: time + GPS at shutter / album: file time, no GPS */
  const geoP=src==="cam"?locate():Promise.resolve(null);
  for(const f of fl)queue.push({f,src,geoP,shot:src==="cam"?Date.now():(f.lastModified||Date.now())});
  $("#fCam").value="";$("#fPick").value="";if(!cur)next();
}
async function next(){

let stream=null,facing="environment",live=null,watchId=null,lastPlaceAt=null,ovlTimer=null,shooting=false;
const T={cat:S.lastCat||"",work:S.lastWork||"",area:S.lastArea||"",room:S.lastRoom||""};
const dist=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lon-a.lon);const q=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(q))};
function stampLines(E,g,ts){
  const L=[fmtTime(ts)];
  if(g)L.push("GPS "+geoText(g));
  const path=[E.cat,E.work,E.area,E.room].filter(Boolean).join(" › ");
  if(path)L.push("\u0001"+path);
  if(E.note)L.push(E.note);
  return L.filter(Boolean);
}
function updOvl(){
  const o=$("#ovl");if(!o)return;
  o.innerHTML=S.stamp?stampLines(T,live,Date.now()).map(l=>l.charAt(0)==="\u0001"?`<span style="color:#FFD60A">${esc(l.slice(1))}</span>`:esc(l)).join("<br>")+(S.geo&&!live?"<br>Locating…":""):"";
}
function toast(t,keep){const e=$("#toast");if(!e)return;e.textContent=t;e.classList.add("on");clearTimeout(e._t);if(!keep)e._t=setTimeout(()=>e.classList.remove("on"),1700)}
function stopCam(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(watchId!=null&&navigator.geolocation){navigator.geolocation.clearWatch(watchId);watchId=null}
  clearInterval(ovlTimer);ovlTimer=null;
}
function startGeo(){
  if(!S.geo||!navigator.geolocation||watchId!=null)return;
  watchId=navigator.geolocation.watchPosition(p=>{
    live={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),place:(live&&live.place)||""};
    if(navigator.onLine&&(!lastPlaceAt||dist(lastPlaceAt,live)>80)){
      lastPlaceAt={lat:live.lat,lon:live.lon};
      placeName(live).then(n=>{if(n&&live){live.place=n;updOvl()}});
    }
    updOvl();
  },()=>{live=null;updOvl()},{enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}
async function startCam(){
  clearInterval(ovlTimer);ovlTimer=setInterval(updOvl,1000);
  const msg=$("#vmsg");
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("nocam");
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1440}},audio:false});
    const v=$("#vid");if(!v){stopCam();return}
    v.srcObject=stream;await v.play().catch(()=>{});
    if(msg)msg.classList.add("hide");
  }catch(e){
    if(msg){msg.classList.remove("hide");
      msg.innerHTML='<div>Camera unavailable<br><span style="opacity:.7">Check that camera access is allowed</span></div><button class="btn" id="fallback">Use device camera</button>';
      $("#fallback").onclick=()=>$("#fCam").click();}
  }
  startGeo();
}
async function shoot(){
  const v=$("#vid");if(shooting||!v||!v.videoWidth)return;shooting=true;
  const fl=$("#flash");fl.classList.remove("go");void fl.offsetWidth;fl.classList.add("go");
  try{
    const k=Math.min(1,1600/Math.max(v.videoWidth,v.videoHeight));
    const c=document.createElement("canvas");c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
    c.getContext("2d").drawImage(v,0,0,c.width,c.height);
    let blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
    const ts=Date.now(),g=live?{...live}:null,E={...T};
    const thumb=await shrink(blob,360,0.7);
    if(S.ai&&S.key&&!E.cat&&navigator.onLine){toast("AI is looking…",true);try{const a=await aiSuggest(blob);if(a)E.cat=a}catch(e){}}
    if(S.stamp||S.logo)blob=await stampBlob(blob,S.stamp?stampLines(E,g,ts):[]);
    const rec={id:ts+Math.random().toString(36).slice(2,6),ts,blob,thumb,cat:E.cat,work:E.work,area:E.area,room:E.room,note:(E.note||"").trim(),lat:g?g.lat:null,lon:g?g.lon:null,acc:g?g.acc:null,place:g?g.place||"":""};
    await dbPut(rec);await refresh();
    T.note="";{const cn=$("#cnote");if(cn)cn.value=""}

    const sb=$("#lastTh");if(sb){sb.innerHTML='<img src="'+tUrl(photos[0])+'">';sb.dataset.id=photos[0].id}
  }catch(e){toast("Could not save, try again")}

}

    <select id="aw" style="margin-top:8px"><option value="">— None —</option>${S.works.map(w=>`<option ${w===setWork?"selected":""}>${esc(w)}</option>`).join("")}</select>
    <div>${(S.areas[setWork]||[]).map((c,i)=>`<div class="li"><span>${esc(c)}</span><button data-k="area" data-i="${i}">✕</button></div>`).join("")}</div>
    <div class="row" style="margin-top:8px"><input type="text" id="ni-area" placeholder="New name"><button class="btn" data-ak="area" style="flex:0 0 80px">Add</button></div></div>
   <div class="card"><b>${esc(KIND.room)}</b>
    <div>${S.rooms.map((c,i)=>`<div class="li"><span>${esc(c)}</span><button data-k="room" data-i="${i}">✕</button></div>`).join("")}</div>
    <div class="row" style="margin-top:8px"><input type="text" id="ni-room" placeholder="New name"><button class="btn" data-ak="room" style="flex:0 0 80px">Add</button></div></div>
   <h3 class="sec">3 · Photo stamp</h3>
   <div class="card"><b>Time and location</b>
    <div class="sw" style="margin-top:8px"><span>Record GPS when shooting<div class="muted">Needs Location permission · place names need internet</div></span><input type="checkbox" id="gT" ${S.geo?"checked":""}></div>
    <div class="sw" style="margin-top:10px"><span>Print date, time and location on photo<div class="muted">Shown as a bar at the bottom of the photo</div></span><input type="checkbox" id="sT" ${S.stamp?"checked":""}></div></div>
   <div class="card"><b>Logo on photo</b><div class="muted">Small, top-left of every photo (transparent PNG looks best)</div>
    ${S.logo?`<div style="margin:10px 0;background:#888;padding:8px;border-radius:8px;display:inline-block"><img src="${S.logo}" style="height:48px;display:block"></div>`:""}
    <div class="row" style="margin-top:8px"><button class="btn sec" id="lg">${S.logo?"Change logo":"Choose logo"}</button>${S.logo?'<button class="btn dng" id="lgx">Remove logo</button>':""}${S.logo!==LOGO?'<button class="btn dng" id="lgd">Default logo</button>':""}</div></div>
   <h3 class="sec">4 · Advanced</h3>
   <div class="card"><b>AI mode (optional)</b><div class="muted">Uses Claude to suggest a category from your list. Needs internet. A resized copy of the photo is sent to Anthropic only while this mode is on.</div>
    <div class="sw" style="margin-top:8px"><span>Enable AI</span><input type="checkbox" id="aiT" ${S.ai?"checked":""}></div>
    <label>Anthropic API key</label><input type="password" id="key" placeholder="sk-ant-…" value="${esc(S.key)}">
    <div class="muted" style="margin-top:6px">Stored on this device only</div></div>
   <h3 class="sec">5 · Export / backup</h3>
   <div class="card"><b>Export layout</b>
    <label>Folders by</label><select id="fo">${Object.entries(folders()).map(([k,v])=>`<option value="${k}" ${k===S.folder?"selected":""}>${v}</option>`).join("")}</select>
    <label>File name includes (tap to toggle)</label>
    <div class="chips" id="fn">${Object.entries(fnames()).map(([k,v])=>`<button class="chip ${S.fname.includes(k)?"on":""}" data-f="${k}">${v}</button>`).join("")}</div>
    <div class="muted" id="ex1"></div></div>
   <div class="card"><b>Export</b><div class="muted">ZIP with folders per your layout, plus index.csv (time, tags, coordinates, Google Maps link).</div>
    ${(()=>{const n=photos.filter(p=>!p.saved).length;return `<button class="btn" id="ex" style="margin-top:10px" ${n?"":"disabled"}>${n?`Export ZIP: next ${Math.min(n,BATCH)} new photos${n>BATCH?` (${n} waiting)`:""}`:"No new photos to export"}</button>
    <div class="muted" id="exmsg" style="margin-top:6px;color:#111"></div>
    ${photos.length>BATCH?`<div class="muted" style="margin-top:10px">Re-export everything, in parts of ${BATCH}:</div><div class="chips" id="exp">${Array.from({length:Math.ceil(photos.length/BATCH)},(_,i)=>`<button class="chip" data-part="${i}">Part ${i+1}</button>`).join("")}</div>`:photos.length?`<button class="chip" id="exall" style="margin-top:8px">Re-export all ${photos.length}</button>`:""}`})()}</div>
   <div class="card muted">Photos are stored on this device (offline). Clearing browser data or deleting the app erases them. Export a backup regularly.</div>`;
  document.querySelectorAll("[data-lb]").forEach(i=>i.onchange=()=>{S.labels[i.dataset.lb]=i.value.trim()||S.labels[i.dataset.lb];persist();vSet()});
  document.querySelectorAll("[data-on]").forEach(i=>i.onchange=()=>{S.on[i.dataset.on]=i.checked;persist()});
  let armed=false;$("#tpb").onclick=()=>{
    if(!armed){armed=true;$("#tpb").textContent="Confirm?";$("#tpm").textContent="This replaces all field names and options with this template (photos are kept). Tap “Confirm?” again.";setTimeout(()=>{if(armed&&$("#tpb")){armed=false;$("#tpb").textContent="Apply";$("#tpm").textContent=""}},4000);return}
    const t=TPL[$("#tp").value];S.labels={...t.labels};S.cats=[...t.cats];S.works=[...t.works];S.rooms=[...t.rooms];S.areas={};S.on={cat:true,work:true,area:true,room:true};S.folder="cat>work>area";S.fname=["cat","work","area","room","seq"];persist();vSet();
  };
  $("#aw").onchange=e=>{setWork=e.target.value;vSet()};
  const sl=k=>k==="work"?S.works:k==="room"?S.rooms:(S.areas[setWork]||(S.areas[setWork]=[]));
  document.querySelectorAll("#main button[data-k]").forEach(b=>b.onclick=()=>{const l=sl(b.dataset.k);l.splice(+b.dataset.i,1);persist();vSet()});
  document.querySelectorAll("#main button[data-ak]").forEach(b=>b.onclick=()=>{const k=b.dataset.ak,v=$("#ni-"+k).value.trim();if(!v)return;const l=sl(k);if(!l.includes(v))l.push(v);persist();vSet()});
  $("#cl").onclick=e=>{const i=e.target.dataset.i;if(i==null)return;S.cats.splice(i,1);persist();vSet()};
  $("#ac").onclick=()=>{const v=$("#nc").value.trim();if(!v)return;if(!S.cats.includes(v))S.cats.push(v);persist();vSet()};
  $("#aiT").onchange=e=>{S.ai=e.target.checked;persist()};
  const ex1=()=>{$("#ex1").textContent="Example: "+pathFor({ts:Date.now(),work:"Sub",cat:"Main",area:"Here",room:"Details",note:""})};ex1();
  $("#fo").onchange=e=>{S.folder=e.target.value;persist();ex1()};
  $("#fn").onclick=e=>{const k=e.target.dataset.f;if(!k)return;const i=S.fname.indexOf(k);if(i>=0)S.fname.splice(i,1);else S.fname.push(k);persist();e.target.classList.toggle("on")  ;ex1()};
  $("#gT").onchange=e=>{S.geo=e.target.checked;persist();if(S.geo&&navigator.geolocation)navigator.geolocation.getCurrentPosition(()=>{},()=>{})};
  $("#lg").onclick=()=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=async()=>{
    const f=i.files[0];if(!f)return;const b=await createImageBitmap(f);const k=Math.min(1,300/Math.max(b.width,b.height));
    const c=document.createElement("canvas");c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);
    S.logo=c.toDataURL("image/png");persist();vSet()};i.click()};
  const ld=$("#lgd");if(ld)ld.onclick=()=>{S.logo=LOGO;persist();vSet()};
  const lx=$("#lgx");if(lx)lx.onclick=()=>{S.logo="";persist();vSet()};
  $("#sT").onchange=e=>{S.stamp=e.target.checked;persist()};
  $("#key").onchange=e=>{S.key=e.target.value.trim();persist()};
  const newest=()=>photos.filter(p=>!p.saved).sort((a,b)=>a.ts-b.ts).slice(0,BATCH);
  $("#ex").onclick=()=>exportZip(newest(),"new");
  const old=photos.slice().sort((a,b)=>a.ts-b.ts);
  const ea=$("#exall");if(ea)ea.onclick=()=>exportZip(old,"all");
  document.querySelectorAll("#exp .chip").forEach(b=>b.onclick=()=>{const i=+b.dataset.part;exportZip(old.slice(i*BATCH,(i+1)*BATCH),"part"+(i+1))});
}

/* ---------- ZIP export (store only) ---------- */
const CT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
const folders=()=>{const L=KIND;return {"cat>work":`${L.cat} / ${L.work}`,"work>cat":`${L.work} / ${L.cat}`,"cat>work>area":`${L.cat} / ${L.work} / ${L.area}`,"cat>work>area>room":`${L.cat} / ${L.work} / ${L.area} / ${L.room}`,"cat>area":`${L.cat} / ${L.area}`,"cat":`${L.cat} only`,"work":`${L.work} only`,"flat":"No folders"}};
const fnames=()=>({seq:"Running number (001, 002…)",time:"Date & time",cat:KIND.cat,work:KIND.work,area:KIND.area,room:KIND.room,note:"Note"});
const cleanN=s=>String(s||"").replace(/[\\/:*?"<>|]/g,"_").trim();
function baseName(p){
  const pad=n=>String(n).padStart(2,"0"),d=new Date(p.ts);
  const tn=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  return ["cat","work","area","room","note","time"].filter(k=>S.fname.includes(k)).map(k=>k==="time"?tn:cleanN(p[k])).filter(Boolean).join("_");
}
function pathFor(p){
  const dir=S.folder==="flat"?[]:S.folder.split(">").map(k=>cleanN(p[k])||"Unspecified");
  let nm=baseName(p);
  if(S.fname.includes("seq")||!nm){
    const same=photos.filter(q=>q.id!==p.id&&baseName(q)===nm&&(q.ts<p.ts||(q.ts===p.ts&&String(q.id)<String(p.id))));
    nm=(nm?nm+"_":"")+String(same.length+1).padStart(3,"0");
  }
  return [...dir,nm+".jpg"].join("/");
}
async function markSaved(list){for(const p of list){p.saved=true;await dbPut(p)}await refresh()}
async function shareList(list){
  const say=t=>{const m=$("#shmsg");if(m)m.textContent=t;else toast(t)};
  const files=list.map(p=>new File([p.blob],pathFor(p).split("/").pop(),{type:"image/jpeg"}));
  if(!(navigator.share&&navigator.canShare&&navigator.canShare({files}))){say("This browser cannot share files. Open SiteSnap from the Home Screen icon, or use Export ZIP.");return}
  try{
    await navigator.share({files});
    await markSaved(list);if($("#shn"))vGal();
  }catch(e){
    if(e&&e.name==="AbortError")return;
    say("Could not open the share sheet ("+(e&&e.name||"error")+"). Try fewer photos or open a photo and tap Share.");
  }
}
const BATCH=150;
async function exportZip(list,tag){
  const msg=t=>{const m=$("#exmsg");if(m)m.textContent=t};
  if(!list||!list.length){msg("No photos to export.");return}
  msg("Preparing ZIP… "+list.length+" photos");
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const clean=s=>(s||"Unspecified").replace(/[\\/:*?"<>|]/g,"_");
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)),dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
  const used=new Set(),rows=[["Time",KIND.cat,KIND.work,KIND.area,KIND.room,"Latitude","Longitude","Google Maps link","Address","Note","File"]];
  const add=(name,data)=>{
    const nm=enc.encode(name),c=crc(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
    h.setUint32(14,c,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,nm,data);
    const e=new DataView(new ArrayBuffer(46));
    e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(10,0,true);e.setUint16(12,dt,true);e.setUint16(14,dd,true);
    e.setUint32(16,c,true);e.setUint32(20,data.length,true);e.setUint32(24,data.length,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
    cd.push(e.buffer,nm);off+=30+nm.length+data.length;nFiles++;
  };
  let nFiles=0;
  for(const p of list){
    let name=pathFor(p);    while(used.has(name))name=name.replace(/\.jpg$/,"_.jpg");used.add(name);
    add(name,new Uint8Array(await p.blob.arrayBuffer()));
    rows.push([fmtTime(p.ts),p.cat||"",p.work||"",p.area||"",p.room||"",p.lat??"",p.lon??"",p.lat!=null?`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`:"",p.place||"",p.note||"",name]);
  }
  const csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  add("index.csv",enc.encode(csv));
  const cdSize=cd.reduce((a,b)=>a+(b.byteLength??b.length),0);
  const z=new DataView(new ArrayBuffer(22));
  z.setUint32(0,0x06054b50,true);z.setUint16(8,nFiles,true);z.setUint16(10,nFiles,true);z.setUint32(12,cdSize,true);z.setUint32(16,off,true);
  const blob=new Blob([...parts,...cd,z.buffer],{type:"application/zip"});
  const file=new File([blob],`SiteSnap_${new Date().toISOString().slice(0,10)}${tag?"_"+tag:""}.zip`,{type:"application/zip"});
  // iOS only allows sharing right after a tap, and building the ZIP takes a while, so ask for a fresh tap.
  const mb=(blob.size/1048576).toFixed(1),m=$("#exmsg");
  if(!m){msg("ZIP ready");return}
  m.innerHTML=`<div style="margin:6px 0 4px"><b>ZIP ready</b> · ${list.length} photos · ${mb} MB</div><button class="btn" id="zgo">Save / Share ZIP</button><button class="lnk" id="zdl" style="margin-top:2px">Download instead</button><div class="muted" id="zmsg" style="margin-top:4px"></div>`;
  const done=async()=>{await markSaved(list);if($("#ex"))vSet();const mm=$("#exmsg");if(mm)mm.textContent="Done: "+list.length+" photos exported."};
  $("#zgo").onclick=async()=>{
    const zm=$("#zmsg");
    try{
      if(!(navigator.canShare&&navigator.canShare({files:[file]}))){zm.textContent="This browser cannot share files. Tap 'Download instead'.";return}
      await navigator.share({files:[file]});await done();
    }catch(e){if(e&&e.name==="AbortError")return;zm.textContent="Could not open the share sheet ("+(e&&e.name||"error")+"). Try 'Download instead'."}
  };
  $("#zdl").onclick=async()=>{
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
    $("#zmsg").textContent="If nothing downloads, use Save / Share ZIP instead.";
  };
}

/* ---------- init ---------- */
(async()=>{
  await openDB();await refresh();
  if(!["en1","en2","en3","en4"].includes(load("ss_ver",""))){
    const t=TPL.general;S.labels={...t.labels};S.cats=[...t.cats];S.works=[];S.rooms=[];S.areas={};S.folder="cat>work>area";S.fname=["cat","work","area","room","seq"];
    S.lastCat=S.lastWork=S.lastArea=S.lastRoom="";T.cat=T.work=T.area=T.room="";
    save("ss_sync",true);save("ss_ver","en4");persist();
  }
  if(load("ss_ver","")==="en1"){S.folder="cat>work>area";S.fname=["cat","work","area","room","seq"];save("ss_ver","en2");persist()}
  if(load("ss_ver","")==="en2"){if(!S.logo)S.logo=LOGO;save("ss_ver","en3");persist()}
  if(S.labels.area==="Place"){S.labels.area="Category";persist()}
  if(S.logo&&S.logo.startsWith("data:image/svg+xml")){S.logo=LOGO;persist()}
  if(load("ss_ver","")==="en3"){S.fname=["cat","work","area","room","seq"];save("ss_ver","en4");persist()}
  if(!load("ss_sync",false)){
    for(const p of photos){
      if(p.work&&!S.works.includes(p.work))S.works.push(p.work);
      if(p.room&&!S.rooms.includes(p.room))S.rooms.push(p.room);
      if(p.area){const a=S.areas[p.work||""]||(S.areas[p.work||""]=[]);if(!a.includes(p.area))a.push(p.area)}
    }
    save("ss_sync",true);persist();
  }
  render();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
})();
</script>
