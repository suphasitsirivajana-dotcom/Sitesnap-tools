<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SiteSnap">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>SiteSnap – Photo organizer</title>
<style>
:root{--bg:#fff;--card:#fff;--ink:#111;--mut:#6b6b6b;--pri:#111;--pri2:#f4f4f4;--line:#e8e8e8;--y:#FFD60A;--danger:#111;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Sarabun","Noto Sans Thai",sans-serif;font-size:16px}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:12px 20px 6px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;letter-spacing:-.3px}.logo i{font-style:normal;font-weight:400;color:var(--mut)}
#cnt{color:var(--mut);font-size:13px}
main{flex:1;overflow:auto;padding:4px 14px calc(100px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 10px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;border:0;background:none;padding:6px 0;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;border-radius:14px}
nav button{position:relative}nav button.on{color:#111;font-weight:700}nav button.on::after{content:"";position:absolute;top:-7px;width:28px;height:3px;border-radius:3px;background:var(--y)}
nav button svg{width:22px;height:22px}nav button.on svg{stroke-width:2.2}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.sec{margin:26px 4px 2px;font-size:12px;letter-spacing:.8px;color:var(--mut);text-transform:uppercase;font-weight:600}
.btn{border:0;border-radius:12px;padding:14px 16px;font-size:15px;font-family:inherit;background:var(--y);color:#111;font-weight:700;width:100%}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.dng{background:#fff;color:#111;border:1px solid #111}
.act{align-items:center;margin-top:18px;gap:4px}.act .btn{flex:1.4;padding:12px}.lnk{background:none;border:0;font:inherit;font-size:14px;color:var(--mut);padding:12px 6px}.lnk.dng{color:#111;text-decoration:underline}
.row{display:flex;gap:8px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-family:inherit;color:var(--ink)}
.chip.on{background:var(--y);border-color:var(--y);color:#111;font-weight:600}
.chip.ai{box-shadow:0 0 0 2px #111}
input[type=text],input[type=password],select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
input[type=checkbox]{width:48px;height:28px;accent-color:var(--pri)}
label{display:block;font-size:12px;color:var(--mut);margin:14px 0 4px;font-weight:600;letter-spacing:.2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.grid div{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:#dde}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.grid span{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(transparent,rgba(0,0,0,.72));color:#fff;font-size:11px;padding:12px 6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet{position:fixed;inset:0;background:rgba(10,25,23,.55);z-index:10;display:none;align-items:flex-end;backdrop-filter:blur(3px)}
.sheet.show{display:flex}
.sheet>div{background:var(--bg);width:100%;max-height:94vh;overflow:auto;border-radius:20px 20px 0 0;padding:12px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet>div::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:#c4d0cd;margin:0 auto 12px}
.sheet img.pv{width:100%;max-height:40vh;object-fit:contain;background:#000;border-radius:14px}
.muted{color:var(--mut);font-size:13px}
.li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.li button{border:0;background:none;color:var(--danger);font-size:20px;padding:4px 10px}
.sw{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hide{display:none}
.eorow{text-align:right;margin-top:8px}
/* camera */
.cam{display:flex;flex-direction:column;gap:12px}
.vf{position:relative;background:#111;border-radius:16px;overflow:hidden;aspect-ratio:3/4;max-height:54vh;width:100%}
.vf video{width:100%;height:100%;object-fit:cover;display:block}
.vf .ovl{position:absolute;left:0;right:0;bottom:0;padding:30px 14px 11px;background:linear-gradient(transparent,rgba(0,0,0,.75));color:#fff;font-size:12px;line-height:1.5;text-shadow:0 1px 2px #000;pointer-events:none}
.vf .lg{position:absolute;top:12px;left:12px;height:34px;max-width:30%;object-fit:contain;pointer-events:none}
.vf .tools{position:absolute;top:12px;right:12px;display:flex;gap:8px}
.tbtn{border:0;background:rgba(0,0,0,.45);color:#fff;border-radius:999px;padding:8px 12px;font-size:13px;font-family:inherit;backdrop-filter:blur(6px)}
.vf .msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:#cfe5e0;text-align:center;padding:24px;font-size:14px}
.vf .msg .btn{width:auto;padding:12px 20px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:fl .28s}
@keyframes fl{from{opacity:.85}to{opacity:0}}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(17,17,17,.92);color:#fff;border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;opacity:0;transition:.2s;white-space:nowrap}
.toast.on{opacity:1}
.tags{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px 10px}
.tags label{margin:8px 0 2px;font-size:12px}
.tags .chips{flex-wrap:nowrap;overflow-x:auto;margin:0 -6px;padding:3px 6px 4px;scrollbar-width:none}
.tags .chips::-webkit-scrollbar{display:none}
.tags .chip{white-space:nowrap;flex:0 0 auto}
.tags .eorow{margin-top:4px;float:right}
.shut{display:flex;align-items:center;justify-content:space-between;padding:2px 14px}
.shbtn{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:var(--y);box-shadow:0 0 0 2px #111;transition:transform .1s}
.shbtn:active{transform:scale(.92)}
.side{width:56px;height:56px;border-radius:14px;border:1px solid var(--line);background:var(--card);overflow:hidden;font-size:12px;color:var(--mut);font-family:inherit;display:flex;align-items:center;justify-content:center;padding:0}
.side img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<header><div class="logo"><svg class="hl" viewBox="40 40 432 432" width="24" height="24"><g transform="translate(256 262) scale(.8) translate(-256 -262)"><path fill="#111" stroke="#111" stroke-width="30" stroke-linejoin="round" d="M96 168h72l28-44h120l28 44h72a24 24 0 0 1 24 24v200a24 24 0 0 1-24 24H96a24 24 0 0 1-24-24V192a24 24 0 0 1 24-24z"/><circle cx="256" cy="288" r="78" fill="#fff"/><circle cx="256" cy="288" r="54" fill="#111"/><circle cx="256" cy="288" r="24" fill="#FFD60A"/><circle cx="404" cy="214" r="12" fill="#FFD60A"/></g></svg><span>Site<i>Snap</i></span></div><span id="cnt"></span></header>
<main id="main"></main>
<nav>
  <button data-t="cam" class="on"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Camera</button>
  <button data-t="gal"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>Library</button>
  <button data-t="set"><svg viewBox="0 0 24 24" width="25" height="25" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Settings</button>
</nav>

<input type="file" id="fCam" accept="image/*" capture="environment" class="hide">
<input type="file" id="fPick" accept="image/*" multiple class="hide">

<div class="sheet" id="sheet"><div id="sheetBody"></div></div>

<script>
"use strict";
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TPL={
 general:{name:"General (works for anyone)",labels:{cat:"Folder",work:"Subfolder",area:"Place",room:"Details"},cats:["Family","Pets","Food","Travel","Work","Other"],works:[],rooms:[]},
 construction:{name:"Construction / site",labels:{cat:"Category",work:"Project",area:"Location",room:"Room / item"},cats:["Windows","Doors","Sanitary","Flooring","Ceiling","Electrical","Plumbing","Other"],works:[],rooms:["Bathroom","Bedroom","Living room","Kitchen","Balcony","Corridor","Lobby","Fire stair"]},
 pets:{name:"Pets",labels:{cat:"Pet",work:"Name",area:"Place",room:"Activity"},cats:["Dog","Cat","Bird","Fish","Other"],works:[],rooms:["Eating","Playing","Sleeping","Vet visit","Bath"]},
 food:{name:"Food",labels:{cat:"Type",work:"Meal / place",area:"Place",room:"Dish / note"},cats:["Savory","Dessert","Drinks","Homemade","Restaurant"],works:["Breakfast","Lunch","Dinner"],rooms:[]},
 blank:{name:"Start blank (set up yourself)",labels:{cat:"Folder",work:"Subfolder",area:"Place",room:"Details"},cats:[],works:[],rooms:[]}
};
const DEF_ROOMS=["Bathroom","Bedroom","Living room","Kitchen","Balcony","Corridor","Lobby","Fire stair"];
const DEF_CATS=["Windows","Doors","Sanitary","Flooring","Ceiling","Electrical","Plumbing","Other"];
const load=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}};
const save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const LOGO="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI1MTIiIGhlaWdodD0iNTEyIiB2aWV3Qm94PSIwIDAgNTEyIDUxMiI+PHJlY3Qgd2lkdGg9IjUxMiIgaGVpZ2h0PSI1MTIiIHJ4PSIxMTIiIGZpbGw9IiNmZmYiLz48ZyB0cmFuc2Zvcm09InRyYW5zbGF0ZSgyNTYgMjYyKSBzY2FsZSguOCkgdHJhbnNsYXRlKC0yNTYgLTI2MikiPjxwYXRoIGZpbGw9IiMxMTEiIHN0cm9rZT0iIzExMSIgc3Ryb2tlLXdpZHRoPSIzMCIgc3Ryb2tlLWxpbmVqb2luPSJyb3VuZCIgZD0iTTk2IDE2OGg3MmwyOC00NGgxMjBsMjggNDRoNzJhMjQgMjQgMCAwIDEgMjQgMjR2MjAwYTI0IDI0IDAgMCAxLTI0IDI0SDk2YTI0IDI0IDAgMCAxLTI0LTI0VjE5MmEyNCAyNCAwIDAgMSAyNC0yNHoiLz48Y2lyY2xlIGN4PSIyNTYiIGN5PSIyODgiIHI9Ijc4IiBmaWxsPSIjZmZmIi8+PGNpcmNsZSBjeD0iMjU2IiBjeT0iMjg4IiByPSI1NCIgZmlsbD0iIzExMSIvPjxjaXJjbGUgY3g9IjI1NiIgY3k9IjI4OCIgcj0iMjQiIGZpbGw9IiNGRkQ2MEEiLz48Y2lyY2xlIGN4PSI0MDQiIGN5PSIyMTQiIHI9IjEyIiBmaWxsPSIjRkZENjBBIi8+PC9nPjwvc3ZnPg==";
const S={cats:load("ss_cats",TPL.general.cats),ai:load("ss_ai",false),key:load("ss_key",""),lastWork:load("ss_lastWork",""),lastCat:load("ss_lastCat",""),lastArea:load("ss_lastArea",""),stamp:load("ss_stamp",true),geo:load("ss_geo",true),logo:load("ss_logo",LOGO),works:load("ss_works",[]),areas:load("ss_areas",{}),rooms:load("ss_rooms",TPL.general.rooms),labels:load("ss_labels",TPL.general.labels),on:load("ss_on",{cat:true,work:true,area:true,room:true}),lastRoom:load("ss_lastRoom",""),folder:load("ss_folder","cat>work>area"),fname:load("ss_fname",["cat","work","area","room","time"])};
const persist=()=>{save("ss_cats",S.cats);save("ss_ai",S.ai);save("ss_key",S.key);save("ss_lastWork",S.lastWork);save("ss_lastCat",S.lastCat);save("ss_lastArea",S.lastArea);save("ss_stamp",S.stamp);save("ss_geo",S.geo);save("ss_logo",S.logo);save("ss_works",S.works);save("ss_areas",S.areas);save("ss_rooms",S.rooms);save("ss_lastRoom",S.lastRoom);save("ss_folder",S.folder);save("ss_labels",S.labels);save("ss_on",S.on);save("ss_fname",S.fname)};

/* ---------- location + timestamp ---------- */
const fmtTime=t=>new Date(t).toLocaleString("en-GB",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
function getGeo(){return new Promise(res=>{
  if(!S.geo||!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(
    p=>res({lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),
    ()=>res(null),{enableHighAccuracy:true,timeout:10000,maximumAge:20000});
})}
async function placeName(g){
  if(!g||!navigator.onLine)return "";
  try{const c=new AbortController();const t=setTimeout(()=>c.abort(),5000);
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=17&accept-language=th&lat=${g.lat}&lon=${g.lon}`,{signal:c.signal});
    clearTimeout(t);const j=await r.json();
    return (j.display_name||"").split(", ").slice(0,4).join(" ");
  }catch{return ""}
}
const locate=()=>getGeo().then(async g=>{if(g)g.place=await placeName(g);return g});
const geoText=g=>g?`${g.place?g.place+" · ":""}${g.lat}, ${g.lon} (±${g.acc} m)`:"";
async function stampBlob(blob,lines){
  const bmp=await createImageBitmap(blob);
  const c=document.createElement("canvas");c.width=bmp.width;c.height=bmp.height;
  const x=c.getContext("2d");x.drawImage(bmp,0,0);
  if(S.logo){
    const im=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=S.logo});
    if(im){const k=Math.min(c.width*0.13/im.width,c.height*0.18/im.height),m=c.width*0.02;x.drawImage(im,m,m,im.width*k,im.height*k)}
  }
  if(!lines.length)return new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
  const fs=Math.max(14,Math.round(c.width/36)),pad=fs*0.6,lh=fs*1.25;
  x.font=`600 ${fs}px system-ui,"Noto Sans Thai",sans-serif`;
  const out=[],col=[];
  lines.forEach((l,li)=>{
    while(l){let n=l.length;while(n>1&&x.measureText(l.slice(0,n)).width>c.width-pad*2)n--;out.push(l.slice(0,n));col.push(li===lines.length-1&&lines.length>1);l=l.slice(n)}
  });
  const h=out.length*lh+pad*1.2;
  x.fillStyle="rgba(0,0,0,.55)";x.fillRect(0,c.height-h,c.width,h);
  x.textBaseline="top";
  out.forEach((l,i)=>{x.fillStyle=col[i]?"#FFD60A":"#fff";x.fillText(l,pad,c.height-h+pad*0.6+i*lh)});
  return new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
}

/* ---------- IndexedDB ---------- */
let db;
const openDB=()=>new Promise((res,rej)=>{const r=indexedDB.open("sitesnap",1);r.onupgradeneeded=()=>r.result.createObjectStore("photos",{keyPath:"id"});r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)});
const tx=(m)=>db.transaction("photos",m).objectStore("photos");
const dbAll=()=>new Promise((res,rej)=>{const r=tx("readonly").getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const dbPut=o=>new Promise((res,rej)=>{const r=tx("readwrite").put(o);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
const dbDel=id=>new Promise((res,rej)=>{const r=tx("readwrite").delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error)});
let photos=[];
const refresh=async()=>{photos=(await dbAll()).sort((a,b)=>b.ts-a.ts);$("#cnt").textContent=photos.length+" photos"};

/* ---------- image processing ---------- */
async function shrink(file,max,q){
  const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});
  const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/jpeg",q));
}
const blobToB64=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(",")[1]);f.readAsDataURL(b)});

/* ---------- AI suggestion (optional) ---------- */
async function aiSuggest(blob){
  const small=await shrink(blob,768,0.7);
  const data=await blobToB64(small);
  const list=S.cats.join(", ");
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{
    "content-type":"application/json","x-api-key":S.key,"anthropic-version":"2023-06-01",
    "anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:30,messages:[{role:"user",content:[
      {type:"image",source:{type:"base64",media_type:"image/jpeg",data}},
      {type:"text",text:"This is a photo. Pick the single best category from this list: "+list+"\nAnswer with the category name exactly as listed, nothing else. If none fits, answer NONE"}]}]})});
  if(!r.ok)throw new Error("AI "+r.status);
  const j=await r.json();
  const t=(j.content?.[0]?.text||"").trim();
  return S.cats.find(c=>t.includes(c))||null;
}

/* ---------- capture flow ---------- */
let queue=[],cur=null;
$("#fCam").onchange=e=>addFiles(e.target.files,"cam");
$("#fPick").onchange=e=>addFiles(e.target.files,"pick");
function addFiles(fl,src){
  /* camera: time + GPS at shutter / album: file time, no GPS */
  const geoP=src==="cam"?locate():Promise.resolve(null);
  for(const f of fl)queue.push({f,src,geoP,shot:src==="cam"?Date.now():(f.lastModified||Date.now())});
  $("#fCam").value="";$("#fPick").value="";if(!cur)next();
}
async function next(){
  const q=queue.shift();
  if(!q){cur=null;closeSheet();await refresh();render();return}
  const f=q.f;
  const full=await shrink(f,1600,0.82),thumb=await shrink(f,360,0.7);
  cur={id:Date.now()+Math.random().toString(36).slice(2,6),ts:q.shot,blob:full,thumb,cat:S.lastCat||"",work:S.lastWork,room:S.lastRoom,area:S.lastArea,note:"",ai:null,url:URL.createObjectURL(full),src:q.src,geo:undefined,geoP:q.geoP};
  { const id=cur.id; q.geoP.then(g=>{if(cur&&cur.id===id){cur.geo=g;const el=$("#locLine");if(el)el.innerHTML=locHTML()}}); }
  showCapture();
  if(S.ai&&S.key&&navigator.onLine){
    const id=cur.id;
    try{const c=await aiSuggest(full);if(cur&&cur.id===id){cur.ai=c||"";if(c)cur.cat=c;showCapture()}}
    catch(e){if(cur&&cur.id===id){cur.ai="ERR";showCapture()}}
  }
}
function chipsHTML(sel,aiCat){return S.cats.map(c=>`<button class="chip ${c===sel?"on":""} ${c===aiCat?"ai":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}
const KIND=new Proxy({},{get:(_,k)=>(S.labels&&S.labels[k])||k});
let editOpts=false;
function presetList(kind,E){
  let l=kind==="cat"?S.cats:kind==="work"?S.works:kind==="room"?S.rooms:(S.areas[E.work||""]||[]);
  l=[...l];if(E[kind]&&!l.includes(E[kind]))l.push(E[kind]);return l;
}
function addPreset(kind,v,E){
  const add=(a)=>{if(!a.includes(v))a.push(v)};
  if(kind==="cat")add(S.cats);else if(kind==="work")add(S.works);else if(kind==="room")add(S.rooms);
  else add(S.areas[E.work||""]||(S.areas[E.work||""]=[]));
  persist();
}
function pickHTML(kind,E){
  return `<label>${KIND[kind]}${kind==="area"?` <span style="color:#777">${E.work?"· of "+esc(E.work):"· (pick "+esc(KIND.work)+" first)"}</span>`:""}</label>
  <div class="chips" data-k="${kind}">${presetList(kind,E).map(v=>`<button class="chip ${v===E[kind]&&!editOpts?"on":""} ${kind==="cat"&&v===E.ai?"ai":""}" data-v="${esc(v)}" ${editOpts?'style="border-color:#c0392b;color:#c0392b"':""}>${esc(v)}${editOpts?" ✕":""}</button>`).join("")}<button class="chip" data-add="1" style="border-style:dashed">+ Add</button></div>`;
}
function removePreset(kind,v,E){
  const rm=(a)=>{const i=a.indexOf(v);if(i>=0)a.splice(i,1)};
  if(kind==="cat")rm(S.cats);else if(kind==="room")rm(S.rooms);
  else if(kind==="work"){rm(S.works);delete S.areas[v]}
  else rm(S.areas[E.work||""]||[]);
  persist();
}
function formHTML(E){
  return `<div class="eorow"><button class="chip ${editOpts?"on":""}" id="eo">${editOpts?"Done":"Edit options"}</button></div>`+
    ["cat","work","area","room"].filter(k=>S.on[k]).map(k=>pickHTML(k,E)).join("");
}
function readNote(E){const n=$("#note");if(n)E.note=n.value}
function bindForm(E,rerender,root="#sheetBody"){
  const eo=$(root+" #eo");if(eo)eo.onclick=()=>{readNote(E);editOpts=!editOpts;rerender()};
  document.querySelectorAll(root+" .chips[data-k]").forEach(box=>{
    const k=box.dataset.k;
    box.onclick=e=>{
      const b=e.target.closest("button");if(!b||b.id==="addOk")return;
      readNote(E);
      if(b.dataset.add){
        b.outerHTML=`<span style="display:inline-flex;gap:6px;width:100%"><input type="text" id="addIn" placeholder="New ${esc(KIND[k])} name" style="padding:8px"><button class="chip on" id="addOk">Add</button></span>`;
        const inp=$("#addIn");inp.focus();
        const commit=()=>{const v=inp.value.trim();if(v){addPreset(k,v,E);E[k]=v}rerender()};
        $("#addOk").onclick=commit;inp.onkeydown=ev=>{if(ev.key==="Enter")commit()};
        return;
      }
      const v=b.dataset.v;
      if(editOpts){removePreset(k,v,E);if(E[k]===v)E[k]="";rerender();return}
      E[k]=(k!=="cat"&&E[k]===v)?"":v;
      if(k==="work"&&E.area&&!(S.areas[E.work||""]||[]).includes(E.area))E.area="";
      rerender();
    };
  });
}
const uniq=f=>[...new Set(photos.map(p=>p[f]).filter(Boolean))];
const dl=(id,f)=>`<datalist id="${id}">${uniq(f).map(w=>`<option value="${esc(w)}">`).join("")}</datalist>`;
function worksList(){return [...new Set(photos.map(p=>p.work).filter(Boolean).concat(S.lastWork?[S.lastWork]:[]))]}
function locHTML(){
  const t=""+fmtTime(cur.ts);
  if(cur.src!=="cam")return t+" · (album photo, no GPS)";
  if(!S.geo)return t+" · GPS off";
  if(cur.geo===undefined)return t+"<br>Locating…";
  if(!cur.geo)return t+"<br>No GPS fix (check Location permission)";
  return t+"<br>GPS "+esc(geoText(cur.geo));
}
function showCapture(){
  const ai=S.ai?(!S.key?"Add an API key in Settings":cur.ai===null?"AI is looking…":cur.ai==="ERR"?"AI unavailable, choose manually":cur.ai?"AI suggests: "+esc(cur.ai):"AI unsure, choose manually"):"";
  $("#sheetBody").innerHTML=`
   <img class="pv" src="${cur.url}">
   <div class="muted" style="margin-top:6px" id="locLine">${locHTML()}</div>${cur.src==="cam"&&S.geo?'<button class="chip" id="reloc" style="margin-top:6px">Refresh location</button>':""}
   <div class="muted" style="margin-top:4px">${ai}${queue.length?` · ${queue.length} more`:""}</div>
   ${formHTML(cur)}
   <label>Note (optional)</label><input type="text" id="note" value="${esc(cur.note)}">
   <div id="err" class="muted" style="color:#c0392b;margin-top:8px"></div>
   <div class="row" style="margin-top:6px"><button class="btn dng" id="skip">Discard</button><button class="btn" id="ok">Save</button></div>`;
  $("#sheet").classList.add("show");
  bindForm(cur,showCapture);
  const rl=$("#reloc");if(rl)rl.onclick=()=>{const id=cur.id;cur.geo=undefined;$("#locLine").innerHTML=locHTML();cur.geoP=locate();cur.geoP.then(g=>{if(cur&&cur.id===id){cur.geo=g;const el=$("#locLine");if(el)el.innerHTML=locHTML()}})};
  $("#skip").onclick=()=>{URL.revokeObjectURL(cur.url);cur=null;next()};
  $("#ok").onclick=async()=>{
    readCur();cur.note=cur.note.trim();
    if(S.on.cat&&!cur.cat){$("#err").textContent="Select "+KIND.cat+" first";return}
    S.lastCat=cur.cat;S.lastWork=cur.work;S.lastArea=cur.area;S.lastRoom=cur.room;persist();
    const okb=$("#ok");okb.disabled=true;okb.textContent="Saving…";
    const g=cur.geo!==undefined?cur.geo:await cur.geoP;
    if(S.stamp||S.logo)cur.blob=await stampBlob(cur.blob,S.stamp?stampLines(cur,g,cur.ts):[]);
    const {url,geoP,geo,src,...rec}=cur;
    rec.lat=g?g.lat:null;rec.lon=g?g.lon:null;rec.acc=g?g.acc:null;rec.place=g?g.place||"":"";
    await dbPut(rec);URL.revokeObjectURL(url);cur=null;
    await refresh();next();
  };
}
function readCur(){readNote(cur)}
function closeSheet(){$("#sheet").classList.remove("show");$("#sheetBody").innerHTML=""}

let tab="cam",fCat="",fWork="";
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("on",x===b));render()});
function render(){if(tab!=="cam")stopCam();({cam:vCam,gal:vGal,set:vSet})[tab]()}

let stream=null,facing="environment",live=null,watchId=null,lastPlaceAt=null,ovlTimer=null,shooting=false;
const T={cat:S.lastCat||"",work:S.lastWork||"",area:S.lastArea||"",room:S.lastRoom||""};
const dist=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lon-a.lon);const q=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(q))};
function stampLines(E,g,ts){
  const L=[fmtTime(ts)];
  if(g)L.push("GPS "+geoText(g));
  L.push([E.cat,E.work,E.area,E.room].filter(Boolean).join(" › "));
  return L.filter(Boolean);
}
function updOvl(){
  const o=$("#ovl");if(!o)return;
  o.innerHTML=S.stamp?stampLines(T,live,Date.now()).map(esc).join("<br>")+(S.geo&&!live?"<br>Locating…":""):"";
}
function toast(t,keep){const e=$("#toast");if(!e)return;e.textContent=t;e.classList.add("on");clearTimeout(e._t);if(!keep)e._t=setTimeout(()=>e.classList.remove("on"),1700)}
function stopCam(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  if(watchId!=null&&navigator.geolocation){navigator.geolocation.clearWatch(watchId);watchId=null}
  clearInterval(ovlTimer);ovlTimer=null;
}
function startGeo(){
  if(!S.geo||!navigator.geolocation||watchId!=null)return;
  watchId=navigator.geolocation.watchPosition(p=>{
    live={lat:+p.coords.latitude.toFixed(6),lon:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy),place:(live&&live.place)||""};
    if(navigator.onLine&&(!lastPlaceAt||dist(lastPlaceAt,live)>80)){
      lastPlaceAt={lat:live.lat,lon:live.lon};
      placeName(live).then(n=>{if(n&&live){live.place=n;updOvl()}});
    }
    updOvl();
  },()=>{live=null;updOvl()},{enableHighAccuracy:true,maximumAge:10000,timeout:20000});
}
async function startCam(){
  clearInterval(ovlTimer);ovlTimer=setInterval(updOvl,1000);
  const msg=$("#vmsg");
  try{
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error("nocam");
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1440}},audio:false});
    const v=$("#vid");if(!v){stopCam();return}
    v.srcObject=stream;await v.play().catch(()=>{});
    if(msg)msg.classList.add("hide");
  }catch(e){
    if(msg){msg.classList.remove("hide");
      msg.innerHTML='<div>Camera unavailable<br><span style="opacity:.7">Check that camera access is allowed</span></div><button class="btn" id="fallback">Use device camera</button>';
      $("#fallback").onclick=()=>$("#fCam").click();}
  }
  startGeo();
}
async function shoot(){
  const v=$("#vid");if(shooting||!v||!v.videoWidth)return;shooting=true;
  const fl=$("#flash");fl.classList.remove("go");void fl.offsetWidth;fl.classList.add("go");
  try{
    const k=Math.min(1,1600/Math.max(v.videoWidth,v.videoHeight));
    const c=document.createElement("canvas");c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);
    c.getContext("2d").drawImage(v,0,0,c.width,c.height);
    let blob=await new Promise(r=>c.toBlob(r,"image/jpeg",0.85));
    const ts=Date.now(),g=live?{...live}:null,E={...T};
    const thumb=await shrink(blob,360,0.7);
    if(S.ai&&S.key&&!E.cat&&navigator.onLine){toast("AI is looking…",true);try{const a=await aiSuggest(blob);if(a)E.cat=a}catch(e){}}
    if(S.stamp||S.logo)blob=await stampBlob(blob,S.stamp?stampLines(E,g,ts):[]);
    const rec={id:ts+Math.random().toString(36).slice(2,6),ts,blob,thumb,cat:E.cat,work:E.work,area:E.area,room:E.room,note:"",lat:g?g.lat:null,lon:g?g.lon:null,acc:g?g.acc:null,place:g?g.place||"":""};
    await dbPut(rec);await refresh();
    toast("Saved"+(E.cat?" · "+E.cat:""));
    const sb=$("#lastTh");if(sb){sb.innerHTML='<img src="'+tUrl(photos[0])+'">';sb.dataset.id=photos[0].id}
  }catch(e){toast("Could not save, try again")}
  shooting=false;
}
function renderTags(){
  S.lastCat=T.cat;S.lastWork=T.work;S.lastArea=T.area;S.lastRoom=T.room;persist();
  const el=$("#tags");if(!el)return;
  el.innerHTML=formHTML(T);
  bindForm(T,renderTags,"#tags");updOvl();
}

document.addEventListener("visibilitychange",()=>{if(document.hidden)stopCam();else if(tab==="cam"&&$("#vid")&&!stream)startCam()});
const urlCache=new Map();
function tUrl(p){if(!urlCache.has(p.id))urlCache.set(p.id,URL.createObjectURL(p.thumb));return urlCache.get(p.id)}
function thumbHTML(p){return `<div data-id="${p.id}"><img src="${tUrl(p)}" loading="lazy"><span>${esc(p.cat)}${p.work?" · "+esc(p.work):""}</span></div>`}
function bindThumbs(){document.querySelectorAll(".grid div[data-id]").forEach(d=>d.onclick=()=>viewPhoto(d.dataset.id))}

function vGal(){
  const works=[...new Set(photos.map(p=>p.work).filter(Boolean))];
  const list=photos.filter(p=>(!fCat||p.cat===fCat)&&(!fWork||p.work===fWork));
  const cats=[...new Set(S.cats.concat(photos.map(p=>p.cat)))];
  $("#main").innerHTML=`
   <div class="chips"><button class="chip ${!fCat?"on":""}" data-c="">All</button>${cats.map(c=>`<button class="chip ${fCat===c?"on":""}" data-c="${esc(c)}">${esc(c)} (${photos.filter(p=>p.cat===c).length})</button>`).join("")}</div>
   <select id="fw"><option value="">All: ${esc(KIND.work)}</option>${works.map(w=>`<option ${w===fWork?"selected":""}>${esc(w)}</option>`).join("")}</select>
   <div class="muted" style="margin:8px 2px">${list.length} photos</div>
   ${list.length?`<button class="btn sec" id="shg">Share filtered photos (latest ${Math.min(list.length,20)})</button>`:""}
   <div class="grid">${list.map(thumbHTML).join("")}</div>`;
  document.querySelectorAll(".chips .chip").forEach(b=>b.onclick=()=>{fCat=b.dataset.c;vGal()});
  const sg=$("#shg");if(sg)sg.onclick=()=>shareList(list.slice(0,20));
  $("#fw").onchange=e=>{fWork=e.target.value;vGal()};
  bindThumbs();
}

function viewPhoto(id){
  const p=photos.find(x=>x.id===id);if(!p)return;
  const url=URL.createObjectURL(p.blob);
  $("#sheetBody").innerHTML=`<img class="pv" src="${url}">
   ${formHTML(p)}
   <label>Note</label><input type="text" id="note" value="${esc(p.note)}">
   <div class="muted" style="margin-top:8px">${fmtTime(p.ts)}${p.lat!=null?`<br>GPS ${esc(p.place?p.place+" · ":"")}${p.lat}, ${p.lon} · <a href="https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}" target="_blank" rel="noopener">Open pin in Google Maps</a>`:""}</div>
   <div class="row act"><button class="lnk dng" id="del">Delete</button><button class="lnk" id="sh">Share</button><button class="lnk" id="cl">Close</button><button class="btn" id="sv">Save</button></div>`;
  $("#sheet").classList.add("show");
  bindForm(p,()=>{URL.revokeObjectURL(url);viewPhoto(id)});
  const done=()=>{URL.revokeObjectURL(url);closeSheet();refresh().then(render)};
  $("#sh").onclick=()=>shareList([p]);
  $("#cl").onclick=()=>{URL.revokeObjectURL(url);closeSheet();refresh().then(render)};
  $("#sv").onclick=async()=>{readNote(p);p.note=p.note.trim();await dbPut(p);done()};
  let dArm=false;$("#del").onclick=async()=>{
    if(!dArm){dArm=true;$("#del").textContent="Tap again to delete";setTimeout(()=>{dArm=false;const b=$("#del");if(b)b.textContent="Delete"},3000);return}
    await dbDel(id);urlCache.delete(id);done()};
}

  document.querySelectorAll("#main button[data-k]").forEach(b=>b.onclick=()=>{const l=sl(b.dataset.k);l.splice(+b.dataset.i,1);persist();vSet()});

  $("#cl").onclick=e=>{const i=e.target.dataset.i;if(i==null)return;S.cats.splice(i,1);persist();vSet()};
  $("#ac").onclick=()=>{const v=$("#nc").value.trim();if(!v)return;if(!S.cats.includes(v))S.cats.push(v);persist();vSet()};
  $("#aiT").onchange=e=>{S.ai=e.target.checked;persist()};
  const ex1=()=>{$("#ex1").textContent="Example: "+pathFor({ts:Date.now(),work:"Sub",cat:"Main",area:"Here",room:"Details",note:""})};ex1();
  $("#fo").onchange=e=>{S.folder=e.target.value;persist();ex1()};
  $("#fn").onclick=e=>{const k=e.target.dataset.f;if(!k)return;const i=S.fname.indexOf(k);if(i>=0)S.fname.splice(i,1);else S.fname.push(k);persist();e.target.classList.toggle("on")  ;ex1()};
  $("#gT").onchange=e=>{S.geo=e.target.checked;persist();if(S.geo&&navigator.geolocation)navigator.geolocation.getCurrentPosition(()=>{},()=>{})};
  $("#lg").onclick=()=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=async()=>{
    const f=i.files[0];if(!f)return;const b=await createImageBitmap(f);const k=Math.min(1,300/Math.max(b.width,b.height));
    const c=document.createElement("canvas");c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);
    S.logo=c.toDataURL("image/png");persist();vSet()};i.click()};
  const ld=$("#lgd");if(ld)ld.onclick=()=>{S.logo=LOGO;persist();vSet()};
  const lx=$("#lgx");if(lx)lx.onclick=()=>{S.logo="";persist();vSet()};
  $("#sT").onchange=e=>{S.stamp=e.target.checked;persist()};
  $("#key").onchange=e=>{S.key=e.target.value.trim();persist()};
  $("#ex").onclick=exportZip;
}

/* ---------- ZIP export (store only) ---------- */
const CT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CT[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0};
const folders=()=>{const L=KIND;return {"cat>work":`${L.cat} / ${L.work}`,"work>cat":`${L.work} / ${L.cat}`,"cat>work>area":`${L.cat} / ${L.work} / ${L.area}`,"cat>area":`${L.cat} / ${L.area}`,"cat":`${L.cat} only`,"work":`${L.work} only`,"flat":"No folders"}};
const fnames=()=>({time:"Date & time",cat:KIND.cat,work:KIND.work,area:KIND.area,room:KIND.room,note:"Note"});
const cleanN=s=>String(s||"").replace(/[\\/:*?"<>|]/g,"_").trim();
function pathFor(p){
  const pad=n=>String(n).padStart(2,"0"),d=new Date(p.ts);
  const tn=`${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
  const dir=S.folder==="flat"?[]:S.folder.split(">").map(k=>cleanN(p[k])||"Unspecified");
  const nm=["cat","work","area","room","note","time"].filter(k=>S.fname.includes(k)).map(k=>k==="time"?tn:cleanN(p[k])).filter(Boolean).join("_")||tn;
  return [...dir,nm+".jpg"].join("/");
}
async function shareList(list){
  const files=list.map(p=>new File([p.blob],pathFor(p).split("/").pop(),{type:"image/jpeg"}));
  if(navigator.canShare&&navigator.canShare({files})){
    try{await navigator.share({files,title:"SiteSnap",text:list.length+" photos"})}catch(e){}
  }else alert("This device/browser cannot share files directly. Use Export ZIP in Settings instead.");
}
async function exportZip(){
  if(!photos.length){alert("No photos yet");return}
  const enc=new TextEncoder(),parts=[],cd=[];let off=0;
  const clean=s=>(s||"Unspecified").replace(/[\\/:*?"<>|]/g,"_");
  const d=new Date(),dt=((d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1)),dd=(((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate());
  const used=new Set(),rows=[["Time",KIND.work,KIND.cat,KIND.room,KIND.area,"Latitude","Longitude","Google Maps link","Place","Note","File"]];
  const add=(name,data)=>{
    const nm=enc.encode(name),c=crc(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,dt,true);h.setUint16(12,dd,true);
    h.setUint32(14,c,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,nm.length,true);h.setUint16(28,0,true);
    parts.push(h.buffer,nm,data);
    const e=new DataView(new ArrayBuffer(46));
    e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(10,0,true);e.setUint16(12,dt,true);e.setUint16(14,dd,true);
    e.setUint32(16,c,true);e.setUint32(20,data.length,true);e.setUint32(24,data.length,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
    cd.push(e.buffer,nm);off+=30+nm.length+data.length;nFiles++;
  };
  let nFiles=0;
  for(const p of photos){
    let name=pathFor(p);    while(used.has(name))name=name.replace(/\.jpg$/,"_.jpg");used.add(name);
    add(name,new Uint8Array(await p.blob.arrayBuffer()));
    rows.push([fmtTime(p.ts),p.work,p.cat,p.room||"",p.area||"",p.lat??"",p.lon??"",p.lat!=null?`https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lon}`:"",p.place||"",p.note||"",name]);
  }
  const csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  add("index.csv",enc.encode(csv));
  const cdSize=cd.reduce((a,b)=>a+(b.byteLength??b.length),0);
  const z=new DataView(new ArrayBuffer(22));
  z.setUint32(0,0x06054b50,true);z.setUint16(8,nFiles,true);z.setUint16(10,nFiles,true);z.setUint32(12,cdSize,true);z.setUint32(16,off,true);
  const blob=new Blob([...parts,...cd,z.buffer],{type:"application/zip"});
  const file=new File([blob],`SiteSnap_${new Date().toISOString().slice(0,10)}.zip`,{type:"application/zip"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file]});return}catch(e){if(e.name==="AbortError")return}}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=file.name;a.click();
}

    for(const p of photos){
      if(p.work&&!S.works.includes(p.work))S.works.push(p.work);

    }
    save("ss_sync",true);persist();
  }
  render();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
})();
